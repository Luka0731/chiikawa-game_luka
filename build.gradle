plugins {
    id 'java'
}

group = 'ch.noseryoung'
version = '1.0-SNAPSHOT'
project.ext.lwjglVersion = "3.2.3"
project.ext.jomlVersion = "1.10.8"
project.ext.lwjglNatives = "natives-windows"
project.ext.imguiVersion = '1.76-0.9'

java {
    sourceCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-ea'
}

test {
    useJUnitPlatform()
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit
    testImplementation('junit:junit:4.13.1')

    // Gson
    implementation 'com.google.code.gson:gson:2.13.1'

    // ImGui
    implementation fileTree('libs') { include '*.jar'}

    // LWJGL
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-assimp"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-nfd"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nfd::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    implementation "org.joml:joml:${jomlVersion}"
}

/*
* |--- Explanations of the used dependencies ---|
*
* LWJGL               ->  low-level framework build for games and multi media programms
* Assimp              ->  for loading 3d-models
* GLFW                ->  window handler. Also responsible for input
* Native File Dialog  ->  a C-library to open file dialogs for any System
* OpenAL              ->  audio library
* OpenGL              ->  grafik library
* stb / stbi          ->  for loading images, fonts, soundfiles, everything
* Gradle              ->  build-tool for java. Makes it easy to import libraries
* ImGui               ->  immediate mode GUI library used to create real-time user interfaces (e.g., debug tools, editors, overlays)
* Gson                ->  library for converting Java objects to JSON and vice versa. More about Gson: https://github.com/google/gson/blob/main/UserGuide.md
*/